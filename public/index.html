<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket Boost</title>
<meta name="description" content="Rocket.rs projects: Propel templates, Ignite admin panels.">
<style>
  :root { color-scheme: light dark; --bg: #f6f7f9; --text: #353841; --heading: #17181c; --accent: #3d50f5; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17181c; --text: #d6d8de; --heading: #ffffff; --accent: #8fa0ff; } }
  :root[data-theme="dark"] { --bg: #17181c; --text: #d6d8de; --heading: #ffffff; --accent: #8fa0ff; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; line-height: 1.6; }
  main { padding: 16px; max-width: 36rem; text-align: center; }
  h1 { color: var(--heading); font-size: 2.5rem; margin: 0 0 .5rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Rocket Boost</h1>
  <p>Coming soon. Rocket.rs projects for templates and admin panels.</p>
  <p><a href="https://propel.rocketboost.rs">Propel</a> · <a href="https://ignite.rocketboost.rs">Ignite</a></p>
</main>
<script data-goatcounter="https://rocketboost.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
